<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Tax Filing Designer</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">E</span>
          <div>
            <strong>e-Tax Filing Designer</strong>
            <span>令和8年仕様 プロトタイプ</span>
          </div>
        </div>

        <nav class="tax-nav" id="taxNav" aria-label="税目"></nav>

        <section class="panel">
          <h2>仕様ソース</h2>
          <p id="specMeta"></p>
          <button class="secondary" id="loadOfficialR07">令和7年申告書を表示</button>
          <button class="secondary" id="loadSample">サンプル値を入れる</button>
          <label class="file-button">
            構造定義XMLを読み込む
            <input id="definitionFile" type="file" accept=".xml,.xsd,.json" />
          </label>
          <p class="file-help">定義XML・e-Tax XSD・入力済みXMLに対応</p>
          <a class="sample-link" href="./examples/r07-income-tax-definition.xml" download>令和7年 帳票・XML構造定義</a>
          <a class="sample-link" href="./assets/forms/r07-income-tax/KOA020-023.xsd" download>公式XSD KOA020 Ver23.0</a>
        </section>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">構造定義XMLから確定申告画面を自動生成</p>
            <h1 id="formTitle"></h1>
          </div>
          <div class="actions">
            <button id="validateButton">検証</button>
            <button id="downloadXml">XML保存</button>
          </div>
        </header>

        <section class="status-grid" id="statusGrid"></section>

        <div class="content-grid">
          <section class="form-area" aria-label="入力フォーム">
            <div class="section-tabs" id="sectionTabs"></div>
            <form id="filingForm"></form>
          </section>

          <section class="preview-area" aria-label="帳票プレビュー">
            <div class="preview-toolbar">
              <div>
                <strong>帳票プレビュー</strong>
                <div class="page-tabs" id="pageTabs"></div>
              </div>
              <span id="validationSummary">未検証</span>
            </div>
            <div class="paper" id="paperPreview"></div>
            <div class="xml-panel">
              <div class="xml-toolbar">
                <strong>XML</strong>
                <button type="button" id="copyXml" aria-label="XMLをコピー">Copy</button>
              </div>
              <pre class="xml-preview" id="xmlPreview"></pre>
            </div>
          </section>
        </div>
      </main>
    </div>

    <template id="fieldTemplate">
      <label class="field">
        <span class="field-label"></span>
        <input />
        <small></small>
      </label>
    </template>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
